<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f1">
<title>Messages · Hesstagram</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app" hidden>
  <main class="main" style="padding-bottom:0">
    <div class="messagerie" id="messagerie">
      <!-- Liste des conversations -->
      <section class="conv-liste">
        <header class="entete" style="position:static;background:none">
          <h1>Messages</h1>
          <div class="actions" data-actions-entete></div>
        </header>
        <div class="recherche">
          <div class="input-icone">
            <span data-ic="recherche"></span>
            <input class="input input-sm" id="filtre-contacts" type="search" placeholder="Rechercher une conversation" style="border-radius:999px;background:var(--card)">
          </div>
        </div>
        <div class="alerte alerte-danger" id="alerte-cle" hidden style="margin:0 22px 12px;flex-direction:column;gap:10px">
          <span id="alerte-texte"></span>
          <button class="btn btn-sm btn-danger-solid" id="regenerer" style="align-self:flex-start">Générer de nouvelles clés</button>
        </div>
        <div class="conv-items" id="liste-contacts"></div>
      </section>

      <!-- Conversation -->
      <section class="chat">
        <header class="chat-tete" id="chat-tete" hidden></header>
        <div class="chat-fil" id="fil-messages">
          <div class="vide" style="margin:auto">
            <div class="illu"><span data-ic="cadenas"></span></div>
            <h3>Vos messages privés</h3>
            <p>Choisissez une conversation. Chaque message est chiffré dans votre navigateur : même le serveur ne peut pas le lire.</p>
          </div>
        </div>
        <form class="chat-saisie barre-envoi" id="saisie" hidden>
          <input class="input" id="texte" placeholder="Écrire un message…" autocomplete="off" maxlength="2000">
          <button class="btn-envoi" type="submit" aria-label="Envoyer" disabled><span data-ic="envoyer"></span></button>
        </form>
      </section>
    </div>
  </main>
</div>

<script src="/app.js"></script>
<script src="/crypto.js"></script>
<script>
let maCle;            // { prive: CryptoKey, publique: base64 } — null si absente de ce navigateur
let contactActif;     // { id, nom, role, cle }
let contacts = [];
let dernierId = 0;
let dernierExpediteur = null;
let dernierJour = null;
let minuterie;
let chargementEnCours = false;   // évite d'afficher deux fois un message si deux relevés se chevauchent

const messagerie = document.getElementById('messagerie');
const fil = document.getElementById('fil-messages');
const saisie = document.getElementById('saisie');
const champ = document.getElementById('texte');
const boutonEnvoi = saisie.querySelector('button');

const heure = iso => new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
function libelleJour(iso) {
  const d = new Date(iso);
  const auj = new Date();
  const hier = new Date(Date.now() - 86400000);
  if (d.toDateString() === auj.toDateString()) return 'Aujourd’hui';
  if (d.toDateString() === hier.toDateString()) return 'Hier';
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

async function verifierMesCles() {
  const etat = await assurerCles(MOI);
  maCle = await lireCleLocale(MOI.id);
  const alerte = document.getElementById('alerte-cle');
  const textes = {
    absente: 'Aucune clé privée dans ce navigateur (autre appareil ou données effacées) : impossible de lire ou d’envoyer des messages.',
    differente: 'La clé de ce navigateur ne correspond plus à votre clé publique : les messages récents sont illisibles ici.'
  };
  alerte.hidden = !textes[etat];
  if (textes[etat]) {
    document.getElementById('alerte-texte').textContent = textes[etat];
    maCle = null;
  }
  if (etat === 'creee') toast('Vos clés de chiffrement ont été créées');
}

document.getElementById('regenerer').onclick = async () => {
  const ok = await confirmer({
    titre: 'Générer de nouvelles clés ?',
    message: 'Les messages chiffrés avec l’ancienne clé ne pourront plus jamais être lus.',
    bouton: 'Générer', danger: true, iconeAlerte: 'alerte'
  });
  if (!ok) return;
  await genererPaireDeCles(MOI);
  await verifierMesCles();
  toast('Nouvelles clés générées');
  if (contactActif) ouvrirConversation(contactActif.id);
};

function afficherContacts() {
  const filtre = document.getElementById('filtre-contacts').value.trim().toLowerCase();
  const zone = document.getElementById('liste-contacts');
  zone.innerHTML = '';
  const visibles = contacts.filter(c => c.nom.toLowerCase().includes(filtre));
  if (!visibles.length) {
    zone.innerHTML = '<p class="muted" style="padding:12px;font-size:14px">Aucun contact trouvé.</p>';
    return;
  }
  for (const c of visibles) {
    const b = document.createElement('button');
    b.className = 'conv-item' + (contactActif?.id === c.id ? ' active' : '');
    const nonLus = c.non_lus && contactActif?.id !== c.id;
    b.innerHTML = `
      ${avatar(c.nom, 50)}
      <span class="infos">
        <span class="nom ellipsis" style="display:block;${nonLus ? 'font-weight:600' : ''}"></span>
        <span class="sous">${c.a_cle
          ? (nonLus ? `<span style="color:var(--o-600);font-weight:500">${pluriel(c.non_lus, 'nouveau message', 'nouveaux messages')}</span>`
                    : (c.dernier ? `${icone('cadenas')}Conversation chiffrée` : 'Démarrer une conversation'))
          : 'Messagerie pas encore activée'}</span>
      </span>
      ${nonLus ? `<span class="compteur-badge">${c.non_lus}</span>` : ''}`;
    b.querySelector('.nom').textContent = c.nom;
    b.onclick = () => ouvrirConversation(c.id);
    zone.appendChild(b);
  }
}

async function chargerContacts() {
  contacts = await api('/api/messages/contacts');
  afficherContacts();
}

async function ouvrirConversation(id) {
  clearInterval(minuterie);
  contactActif = await api(`/api/cles/${id}`);
  dernierId = 0;
  dernierExpediteur = null;
  dernierJour = null;
  messagerie.classList.add('conv-ouverte');
  history.replaceState(null, '', `/messages.html?avec=${id}`);

  const tete = document.getElementById('chat-tete');
  tete.hidden = false;
  tete.innerHTML = `
    <button class="btn btn-icon" data-retour aria-label="Retour aux conversations">${icone('retour')}</button>
    <a href="/profil.html?id=${contactActif.id}">${avatar(contactActif.nom, 48)}</a>
    <div class="infos">
      <a class="nom ellipsis" href="/profil.html?id=${contactActif.id}" style="color:inherit;display:block"></a>
      <div class="sous">${contactActif.cle ? `${icone('cadenas', 'icone-sm')}Chiffré de bout en bout` : 'Messagerie non activée'}</div>
    </div>
    ${contactActif.cle ? `<button class="btn btn-icon" data-securite aria-label="Vérifier le chiffrement" title="Vérifier le chiffrement" style="color:var(--o-600)">${icone('bouclier')}</button>` : ''}
    <a class="btn btn-icon" href="/profil.html?id=${contactActif.id}" aria-label="Voir le profil">${icone('profil')}</a>`;
  tete.querySelector('.nom').textContent = contactActif.nom;
  tete.querySelector('[data-retour]').onclick = () => {
    messagerie.classList.remove('conv-ouverte');
    contactActif = null;
    clearInterval(minuterie);
    history.replaceState(null, '', '/messages.html');
    chargerContacts();
  };
  tete.querySelector('[data-securite]')?.addEventListener('click', afficherSecurite);

  fil.innerHTML = contactActif.cle
    ? `<div class="bandeau-chiffre">${icone('cadenas')}Les messages sont chiffrés de bout en bout. Personne d’autre, pas même Hesstagram, ne peut les lire.</div>
       <div class="vide" data-vide style="margin:auto"><div class="illu">${icone('messages')}</div><h3>Dites bonjour à ${escapeHtml(contactActif.nom)}</h3><p>Votre premier message sera chiffré avant de quitter votre appareil.</p></div>`
    : `<div class="vide" style="margin:auto"><div class="illu">${icone('cadenas')}</div><h3>${escapeHtml(contactActif.nom)} n’a pas encore activé la messagerie</h3><p>Sans sa clé publique, impossible de lui écrire un message chiffré. Elle est créée à sa prochaine connexion.</p></div>`;
  saisie.hidden = !contactActif.cle || !maCle;

  await chargerNouveauxMessages();
  chargerContacts();
  majCompteurs();
  minuterie = setInterval(chargerNouveauxMessages, 3000);
  if (!saisie.hidden) champ.focus();
}

async function afficherSecurite() {
  const [sienne, mienne] = await Promise.all([empreinte(contactActif.cle), maCle ? empreinte(maCle.publique) : null]);
  const m = ouvrirModal({
    titre: 'Vérifier le chiffrement',
    largeur: 460,
    corps: `
      <p>Comparez ces empreintes avec ${escapeHtml(contactActif.nom)}, de vive voix ou en personne. Si elles correspondent, personne ne peut intercepter vos messages.</p>
      <div class="bloc"><h4>${avatar(contactActif.nom, 26)}<span data-nom></span></h4><div class="mono" style="font-size:15px;letter-spacing:.05em">${sienne}</div></div>
      ${mienne ? `<div class="bloc"><h4>${avatar(MOI.nom, 26)}Vous</h4><div class="mono" style="font-size:15px;letter-spacing:.05em">${mienne}</div></div>` : ''}
      <div class="alerte alerte-info">${icone('info')}<span>RSA-OAEP 2048 bits pour l’échange de clés, AES-GCM 256 bits pour chaque message.</span></div>`,
    pied: '<button class="btn btn-primary" data-fermer>Compris</button>'
  });
  m.$('[data-nom]').textContent = contactActif.nom;
}

async function chargerNouveauxMessages() {
  if (!contactActif || chargementEnCours) return;
  chargementEnCours = true;
  try {
    await afficherNouveauxMessages();
  } finally {
    chargementEnCours = false;
  }
}

async function afficherNouveauxMessages() {
  const idConv = contactActif.id;
  const lignes = await api(`/api/messages/${idConv}?apres=${dernierId}`);
  if (contactActif?.id !== idConv || !lignes.length) return;   // conversation changée entre-temps
  fil.querySelector('[data-vide]')?.remove();

  for (const l of lignes) {
    if (contactActif?.id !== idConv) return;
    dernierId = Math.max(dernierId, l.id);
    const deMoi = l.id_exp === MOI.id;
    let contenu;
    try {
      if (!maCle) throw new Error('pas de clé');
      contenu = await dechiffrerMessage(l, MOI.id, maCle.prive);
    } catch {
      contenu = null;
    }

    if (contenu) {
      const jour = new Date(contenu.date).toDateString();
      if (jour !== dernierJour) {
        dernierJour = jour;
        dernierExpediteur = null;
        fil.insertAdjacentHTML('beforeend', `<div class="chat-jour">${libelleJour(contenu.date)}</div>`);
      }
    }

    const ligne = document.createElement('div');
    ligne.className = `bulle-ligne ${deMoi ? 'moi' : ''} ${dernierExpediteur === l.id_exp ? 'suite' : ''}`;
    ligne.innerHTML = `${deMoi ? '' : avatar(contactActif.nom, 32)}<div class="bulle"></div>`;
    const bulle = ligne.querySelector('.bulle');
    if (contenu) {
      bulle.textContent = contenu.texte;                 // textContent : aucun HTML injecté
      bulle.insertAdjacentHTML('beforeend', `<span class="heure">${heure(contenu.date)}</span>`);
    } else {
      bulle.classList.add('illisible');
      bulle.textContent = 'Message chiffré illisible avec la clé de ce navigateur';
    }
    dernierExpediteur = l.id_exp;
    fil.appendChild(ligne);
  }
  fil.scrollTop = fil.scrollHeight;
}

champ.oninput = () => { boutonEnvoi.disabled = !champ.value.trim(); };
saisie.onsubmit = async e => {
  e.preventDefault();
  const texte = champ.value.trim();
  if (!texte || !contactActif?.cle || !maCle) return;
  boutonEnvoi.disabled = true;
  champ.value = '';
  try {
    const paquet = await chiffrerMessage(texte, contactActif.cle, maCle.publique);
    await api('/api/messages', { method: 'POST', body: { id_dest: contactActif.id, paquet } });
    await chargerNouveauxMessages();
  } catch (err) {
    champ.value = texte;                               // on ne perd pas le texte en cas d'échec
    toastErreur(err);
  }
  champ.focus();
  champ.oninput();
};

(async () => {
  await demarrerApp('messages');
  document.querySelectorAll('[data-ic]').forEach(s => { s.outerHTML = icone(s.dataset.ic); });
  document.getElementById('filtre-contacts').oninput = afficherContacts;

  if (!window.crypto?.subtle) {
    fil.innerHTML = `<div class="vide" style="margin:auto"><div class="illu">${icone('alerte')}</div><h3>Connexion non sécurisée</h3><p>Le chiffrement nécessite https ou localhost.</p></div>`;
    return;
  }
  await verifierMesCles();
  await chargerContacts();
  const cible = Number(new URLSearchParams(location.search).get('avec'));
  if (cible) ouvrirConversation(cible).catch(toastErreur);
  setInterval(() => { if (!contactActif) chargerContacts(); }, 10000);
})();
</script>
</body>
</html>
