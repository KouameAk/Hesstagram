<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publier - Hesstagram</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 500px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  .tabs {
    display: flex;
    border-bottom: 2px solid #ddd;
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    background: none;
    border: none;
    font-size: 1rem;
    font-weight: bold;
    color: #666;
  }
  .tab.active {
    color: #000;
    border-bottom: 2px solid #000;
    margin-bottom: -2px;
  }
  .tab-content {
    display: none;
  }
  .tab-content.active {
    display: block;
  }
  label {
    display: block;
    margin-top: 15px;
    font-size: 0.9rem;
    font-weight: bold;
  }
  input, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
    box-sizing: border-box;
  }
  button[type="submit"] {
    margin-top: 20px;
    padding: 10px 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
  }
  button[type="submit"]:hover {
    background: #0056b3;
  }
  .message {
    margin-top: 20px;
    padding: 10px;
    border-radius: 4px;
    display: none;
  }
  .message.success {
    background: #d4edda;
    color: #155724;
    display: block;
  }
  .message.error {
    background: #f8d7da;
    color: #721c24;
    display: block;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: #007bff;
  }
</style>
</head>
<body>
  <a href="accueil.html" class="back-link">&larr; Retour à l'accueil</a>
  
  <h1>Nouvelle publication</h1>

  <!-- LES BOUTONS DES ONGLETS -->
  <div class="tabs">
    <button class="tab active" data-target="tab-video">Vidéo</button>
    <button class="tab" data-target="tab-photo">Photo</button>
  </div>

  <!-- LE FORMULAIRE VIDÉO -->
  <div id="tab-video" class="tab-content active">
    <form id="form-video" enctype="multipart/form-data">
      
      <label>Fichier vidéo
        <input type="file" name="video" accept="video/*" required>
      </label>
      
      <label>Description
        <textarea name="description" rows="4" placeholder="Écrivez une description..."></textarea>
      </label>

      <button type="submit">Publier la vidéo</button>
    </form>
    <div id="message-video" class="message"></div>
  </div>

  <!-- LE FORMULAIRE PHOTO (TON TRAVAIL) -->
  <div id="tab-photo" class="tab-content">
    <form id="form-photo" enctype="multipart/form-data">
      
      <label>Fichier image
        <input type="file" name="photo" accept="image/*" required>
      </label>
      
      <label>Description
        <textarea name="description" rows="4" placeholder="Écrivez une légende..."></textarea>
      </label>

      <button type="submit">Publier la photo</button>
    </form>
    <div id="message-photo" class="message"></div>
  </div>

  <script>
    // Vérifier que l'utilisateur est connecté, sinon le renvoyer au login
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    // Gestion des onglets
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    // Envoi du formulaire vidéo avec le token JWT dans les headers
    const formVideo = document.getElementById('form-video');
    const msgVideo = document.getElementById('message-video');

    formVideo.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgVideo.className = 'message';
      msgVideo.textContent = 'Envoi et conversion en cours... Veuillez patienter.';
      msgVideo.style.display = 'block';

      const formData = new FormData(formVideo);

      try {
        const response = await fetch('/api/publications/video', {
          method: 'POST',
          headers: {
            // On envoie le token JWT dans l'en-tête Authorization
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        // Lire la réponse sous forme JSON ou texte
        const contentType = response.headers.get('content-type') || '';
        let data = {};
        if (contentType.includes('application/json')) {
          data = await response.json();
        } else {
          const rawText = await response.text();
          data = { message: rawText || `Erreur HTTP ${response.status}` };
        }

        if (response.ok && data.success) {
          msgVideo.className = 'message success';
          msgVideo.textContent = 'Vidéo publiée avec succès !';
          formVideo.reset();
        } else if (response.status === 401) {
          localStorage.removeItem('token');
          window.location.href = 'index.html';
        } else {
          msgVideo.className = 'message error';
          msgVideo.textContent = data.message || 'Une erreur est survenue lors de la publication.';
        }
      } catch (err) {
        msgVideo.className = 'message error';
        msgVideo.textContent = 'Erreur : ' + err.message;
      }
    });

    // Envoi du formulaire photo avec le token JWT dans les headers
    const formPhoto = document.getElementById('form-photo');
    const msgPhoto = document.getElementById('message-photo');

    formPhoto.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgPhoto.className = 'message';
      msgPhoto.textContent = 'Envoi de la photo en cours...';
      msgPhoto.style.display = 'block';

      const formData = new FormData(formPhoto);

      try {
        const response = await fetch('/api/publications/photo', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const contentType = response.headers.get('content-type') || '';
        let data = {};
        if (contentType.includes('application/json')) {
          data = await response.json();
        } else {
          const rawText = await response.text();
          data = { message: rawText || `Erreur HTTP ${response.status}` };
        }

        if (response.ok && data.success) {
          msgPhoto.className = 'message success';
          msgPhoto.textContent = 'Photo publiée avec succès !';
          formPhoto.reset();
        } else if (response.status === 401) {
          localStorage.removeItem('token');
          window.location.href = 'index.html';
        } else {
          msgPhoto.className = 'message error';
          msgPhoto.textContent = data.message || 'Une erreur est survenue lors de la publication.';
        }
      } catch (err) {
        msgPhoto.className = 'message error';
        msgPhoto.textContent = 'Erreur : ' + err.message;
      }
    });
  </script>
</body>
</html>
