<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publier - Hesstagram</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 500px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  .tabs {
    display: flex;
    border-bottom: 2px solid #ddd;
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    background: none;
    border: none;
    font-size: 1rem;
    font-weight: bold;
    color: #666;
  }
  .tab.active {
    color: #000;
    border-bottom: 2px solid #000;
    margin-bottom: -2px;
  }
  .tab-content {
    display: none;
  }
  .tab-content.active {
    display: block;
  }
  label {
    display: block;
    margin-top: 15px;
    font-size: 0.9rem;
    font-weight: bold;
  }
  input, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
    box-sizing: border-box;
  }
  button[type="submit"] {
    margin-top: 20px;
    padding: 10px 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
  }
  button[type="submit"]:hover {
    background: #0056b3;
  }
  .message {
    margin-top: 20px;
    padding: 10px;
    border-radius: 4px;
    display: none;
  }
  .message.success {
    background: #d4edda;
    color: #155724;
    display: block;
  }
  .message.error {
    background: #f8d7da;
    color: #721c24;
    display: block;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: #007bff;
  }
</style>
</head>
<body>
  <a href="accueil.html" class="back-link">&larr; Retour à l'accueil</a>
  
  <h1>Nouvelle publication</h1>

  <!-- LES BOUTONS DES ONGLETS -->
  <div class="tabs">
    <button class="tab active" data-target="tab-video">Vidéo</button>
    <button class="tab" data-target="tab-photo">Photo</button>
  </div>

  <!-- LE FORMULAIRE VIDÉO -->
  <div id="tab-video" class="tab-content active">
    <form id="form-video" enctype="multipart/form-data">
      <input type="hidden" name="idUtilisateur" id="idUtilisateurVideo" value="1">
      
      <label>Fichier vidéo
        <input type="file" name="video" accept="video/*" required>
      </label>
      
      <label>Description
        <textarea name="description" rows="4" placeholder="Écrivez une description..."></textarea>
      </label>

      <button type="submit">Publier la vidéo</button>
    </form>
    <div id="message-video" class="message"></div>
  </div>

  <!-- LE FORMULAIRE PHOTO (TON TRAVAIL) -->
  <div id="tab-photo" class="tab-content">
    <form id="form-photo" enctype="multipart/form-data">
      <input type="hidden" name="idUtilisateur" id="idUtilisateurPhoto" value="1">
      
      <label>Fichier image
        <input type="file" name="photo" accept="image/*" required>
      </label>
      
      <label>Description
        <textarea name="description" rows="4" placeholder="Écrivez une légende..."></textarea>
      </label>

      <button type="submit">Publier la photo</button>
    </form>
    <div id="message-photo" class="message"></div>
  </div>

  <script>
    // 1. GESTION DES ONGLETS (Ce qui bloquait !)
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Retire l'état actif partout
        tabs.forEach(t => t.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        
        // Active le bon onglet
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    // 2. GESTION DU FORMULAIRE VIDÉO
    const formVideo = document.getElementById('form-video');
    const msgVideo = document.getElementById('message-video');

    formVideo.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgVideo.className = 'message';
      msgVideo.textContent = 'Envoi et conversion en cours... Veuillez patienter.';
      msgVideo.style.display = 'block';

      try {
        const response = await fetch('/api/publications/video', {
          method: 'POST',
          body: new FormData(formVideo)
        });
        const data = await response.json();
        if (response.ok) {
          msgVideo.className = 'message success';
          msgVideo.textContent = 'Vidéo publiée avec succès !';
          formVideo.reset();
        } else {
          msgVideo.className = 'message error';
          msgVideo.textContent = data.message || 'Une erreur est survenue.';
        }
      } catch (err) {
        msgVideo.className = 'message error';
        msgVideo.textContent = 'Erreur réseau : ' + err.message;
      }
    });

    // 3. GESTION DU FORMULAIRE PHOTO
    const formPhoto = document.getElementById('form-photo');
    const msgPhoto = document.getElementById('message-photo');

    formPhoto.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgPhoto.className = 'message';
      msgPhoto.textContent = 'Envoi de la photo en cours...';
      msgPhoto.style.display = 'block';

      try {
        const response = await fetch('/api/publications/photo', {
          method: 'POST',
          body: new FormData(formPhoto)
        });
        const data = await response.json();
        if (response.ok) {
          msgPhoto.className = 'message success';
          msgPhoto.textContent = 'Photo publiée avec succès !';
          formPhoto.reset();
        } else {
          msgPhoto.className = 'message error';
          msgPhoto.textContent = data.message || 'Une erreur est survenue.';
        }
      } catch (err) {
        msgPhoto.className = 'message error';
        msgPhoto.textContent = 'Erreur réseau : ' + err.message;
      }
    });
  </script>
</body>
</html>
