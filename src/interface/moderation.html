<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1b17">
<title>Modération · Hesstagram</title>
<link rel="icon" href="/logo_Hesstagram.png">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<style>
  .rapports { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .rapport { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--bg); border-radius: var(--r-sm); }
  .rapport .corps { flex: 1; min-width: 0; font-size: 14.5px; }
  .rapport .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .pub-mini { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .pub-mini:last-child { border-bottom: none; }
  .pub-mini img, .pub-mini video, .pub-mini .sans-image { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; flex: none; background: var(--grad-soft); display: grid; place-items: center; color: var(--o-700); }
  .pub-mini .txt { flex: 1; min-width: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div class="console" id="console" hidden>
  <main class="console-main">
    <div class="console-entete">
      <div class="titres">
        <h1>File de signalements</h1>
        <p>Examinez chaque dossier : consultez les publications du compte, retirez un contenu si nécessaire, puis clôturez.</p>
      </div>
      <button class="btn" id="actualiser"></button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="table-outils card" style="border-radius:var(--r-lg);margin-bottom:16px;border:none">
      <div class="input-icone">
        <span data-ic="recherche"></span>
        <input class="input input-sm" id="recherche" type="search" placeholder="Rechercher un compte ou un motif">
      </div>
      <div class="chips">
        <button class="chip active" data-filtre="tous">Tous</button>
        <button class="chip" data-filtre="recurrents">Récidives (3+)</button>
        <button class="chip" data-filtre="recents">Moins de 24 h</button>
      </div>
    </div>

    <div id="dossiers" style="display:flex;flex-direction:column;gap:14px"></div>
  </main>
</div>

<script src="/app.js"></script>
<script>
let signalements = [];
let filtre = 'tous';

// Un dossier = tous les signalements visant le même compte
function dossiers() {
  const parCompte = new Map();
  for (const s of signalements) {
    if (!parCompte.has(s.id_signale)) {
      parCompte.set(s.id_signale, { id: s.id_signale, nom: s.signale, role: s.role_signale, suspendu: s.suspendu, nb_publications: s.nb_publications, rapports: [] });
    }
    parCompte.get(s.id_signale).rapports.push(s);
  }
  return [...parCompte.values()].sort((a, b) => b.rapports.length - a.rapports.length || new Date(b.rapports[0].date) - new Date(a.rapports[0].date));
}

function afficherKpis() {
  const d = dossiers();
  const recents = signalements.filter(s => Date.now() - new Date(s.date) < 86400000).length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi ${signalements.length ? 'alerte' : ''}"><div class="haut">Signalements en attente<span class="pastille-ic">${icone('drapeau')}</span></div><div class="valeur">${signalements.length}</div><div class="bas">${pluriel(d.length, 'compte concerné', 'comptes concernés')}</div></div>
    <div class="kpi accent"><div class="haut">Récidives<span class="pastille-ic">${icone('alerte')}</span></div><div class="valeur">${d.filter(x => x.rapports.length >= 3).length}</div><div class="bas">comptes signalés 3 fois ou plus</div></div>
    <div class="kpi"><div class="haut">Dernières 24 h<span class="pastille-ic">${icone('horloge')}</span></div><div class="valeur">${recents}</div><div class="bas">nouveaux signalements</div></div>`;
}

function afficherDossiers() {
  const q = document.getElementById('recherche').value.trim().toLowerCase();
  const zone = document.getElementById('dossiers');
  const liste = dossiers().filter(d =>
    (filtre !== 'recurrents' || d.rapports.length >= 3)
    && (filtre !== 'recents' || d.rapports.some(s => Date.now() - new Date(s.date) < 86400000))
    && (!q || d.nom.toLowerCase().includes(q) || d.rapports.some(s => s.raison.toLowerCase().includes(q))));

  zone.innerHTML = '';
  if (!liste.length) {
    zone.innerHTML = signalements.length
      ? `<div class="card vide"><div class="illu">${icone('filtre')}</div><h3>Aucun dossier ne correspond</h3><p>Modifiez la recherche ou le filtre.</p></div>`
      : `<div class="card vide"><div class="illu">${icone('coche')}</div><h3>La file est vide</h3><p>Aucun signalement en attente. Beau travail !</p></div>`;
    return;
  }

  for (const d of liste) {
    const carte = document.createElement('article');
    carte.className = 'signalement-carte';
    carte.innerHTML = `
      ${avatar(d.nom, 56)}
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font:500 18px var(--font);color:var(--ink)" data-nom></span>
          ${badgeStatut(d.role)}
          <span class="etat ${d.rapports.length >= 3 ? 'etat-ko' : 'etat-attente'}">${pluriel(d.rapports.length, 'signalement')}</span>
          ${d.suspendu ? '<span class="etat etat-neutre">Suspendu</span>' : ''}
        </div>
        <div class="muted" style="font-size:13.5px;margin-top:2px">${pluriel(d.nb_publications, 'publication')} · dernier signalement ${ilYa(d.rapports[0].date)}</div>
        <div class="rapports"></div>
      </div>
      <div class="actions">
        <button class="btn btn-sm btn-dark" data-voir>${icone('oeil', 'icone-sm')}Publications</button>
        <button class="btn btn-sm" data-clore>${icone('coche', 'icone-sm')}Clore le dossier</button>
        ${MOI.role === 'admin' ? `<a class="btn btn-sm btn-soft" href="/admin.html#comptes-${d.id}">${icone('interdit', 'icone-sm')}Sanctionner</a>` : ''}
      </div>`;
    carte.querySelector('[data-nom]').textContent = d.nom;

    const zoneRapports = carte.querySelector('.rapports');
    for (const s of d.rapports) {
      const r = document.createElement('div');
      r.className = 'rapport';
      r.innerHTML = `
        <div class="corps"><div data-raison style="overflow-wrap:anywhere"></div><div class="meta">par <span data-par></span> · <span title="${horodatage(s.date)}">${ilYa(s.date)}</span></div></div>
        <button class="btn btn-xs btn-ghost" title="Classer ce signalement sans suite">Classer</button>`;
      r.querySelector('[data-raison]').textContent = s.raison;
      r.querySelector('[data-par]').textContent = s.signalant;
      r.querySelector('button').onclick = () => classer([s], 'classé sans suite');
      zoneRapports.appendChild(r);
    }

    carte.querySelector('[data-voir]').onclick = () => voirPublications(d);
    carte.querySelector('[data-clore]').onclick = () => clore(d);
    zone.appendChild(carte);
  }
}

async function classer(liste, decision) {
  try {
    for (const s of liste) await api(`/api/moderation/signalements/${s.id}`, { method: 'DELETE', body: { decision } });
    toast(liste.length > 1 ? `${liste.length} signalements clôturés` : 'Signalement clôturé');
    await charger();
  } catch (err) { toastErreur(err); }
}

function clore(d) {
  const m = ouvrirModal({
    titre: `Clore le dossier ${d.nom}`,
    largeur: 480,
    corps: `
      <p>${pluriel(d.rapports.length, 'signalement')} seront retirés de la file. La décision est inscrite dans le journal.</p>
      <div class="field">
        <span class="label">Décision</span>
        <div class="raisons-rapides">
          <button type="button" class="active" data-decision="classé sans suite">Sans suite</button>
          <button type="button" data-decision="traité : contenu retiré">Contenu retiré</button>
          <button type="button" data-decision="traité : avertissement envoyé">Avertissement</button>
          ${MOI.role === 'admin' ? '' : '<button type="button" data-decision="transmis à l’administration">Transmis à l’admin</button>'}
        </div>
      </div>`,
    pied: `<button class="btn" data-fermer>Annuler</button><button class="btn btn-primary" data-ok>Clore le dossier</button>`
  });
  let decision = 'classé sans suite';
  m.dialog.querySelectorAll('[data-decision]').forEach(b => {
    b.onclick = () => {
      decision = b.dataset.decision;
      m.dialog.querySelectorAll('[data-decision]').forEach(x => x.classList.toggle('active', x === b));
    };
  });
  m.$('[data-ok]').onclick = () => { m.fermer(); classer(d.rapports, decision); };
}

async function voirPublications(d) {
  const m = ouvrirModal({
    titre: `Publications de ${d.nom}`,
    largeur: 560,
    corps: '<div data-liste><div class="skeleton" style="height:60px"></div></div>',
    pied: `<button class="btn btn-primary" data-fermer>Terminé</button>`
  });
  const zone = m.$('[data-liste]');
  const rendre = async () => {
    const pubs = await api(`/api/publications?auteur=${d.id}`);
    zone.innerHTML = pubs.length ? '' : `<div class="vide"><div class="illu">${icone('image')}</div><p>Ce compte n’a aucune publication.</p></div>`;
    for (const p of pubs) {
      const el = document.createElement('div');
      el.className = 'pub-mini';
      el.innerHTML = `
        ${!p.media ? `<span class="sans-image">${icone('filtre')}</span>`
          : String(p.type_fichier).startsWith('video/') ? `<video src="${p.media}" muted preload="metadata"></video>` : `<img src="${p.media}" alt="">`}
        <div style="flex:1;min-width:0"><div class="txt"></div><div class="muted" style="font-size:12.5px;margin-top:2px">n°${p.id} · ${ilYa(p.date)} · ${pluriel(p.nb_like, 'j’aime', 'j’aime')} · ${p.nb_dislike} je n’aime pas</div></div>
        <button class="btn btn-xs btn-danger">${icone('poubelle', 'icone-sm')}Retirer</button>`;
      el.querySelector('.txt').textContent = p.description || '(sans description)';
      el.querySelector('button').onclick = async () => {
        const motif = d.rapports[0]?.raison.split(' — ')[0] || 'Contenu contraire aux règles';
        const ok = await confirmer({ titre: 'Retirer cette publication ?', message: `Motif inscrit au journal : « ${motif} ».`, bouton: 'Retirer', danger: true });
        if (!ok) return;
        try {
          await api(`/api/publications/${p.id}`, { method: 'DELETE', body: { raison: motif } });
          toast('Publication retirée');
          rendre();
        } catch (err) { toastErreur(err); }
      };
      zone.appendChild(el);
    }
  };
  rendre().catch(toastErreur);
}

async function charger() {
  signalements = await api('/api/moderation/file');
  afficherKpis();
  afficherDossiers();
  document.querySelectorAll('[data-badge="signalements"]').forEach(el => { el.hidden = !signalements.length; el.textContent = signalements.length; });
}

(async () => {
  if (!await demarrerConsole('moderation', ['modo', 'admin'])) return;
  poserIcones();
  const act = document.getElementById('actualiser');
  act.innerHTML = `${icone('actualiser', 'icone-sm')}Actualiser`;
  act.onclick = () => charger().then(() => toast('File à jour'));
  document.getElementById('recherche').oninput = afficherDossiers;
  document.querySelectorAll('[data-filtre]').forEach(b => {
    b.onclick = () => {
      filtre = b.dataset.filtre;
      document.querySelectorAll('[data-filtre]').forEach(x => x.classList.toggle('active', x === b));
      afficherDossiers();
    };
  });
  document.getElementById('dossiers').innerHTML = '<div class="skeleton" style="height:160px;border-radius:24px"></div>'.repeat(2);
  await charger();
})();
</script>
</body>
</html>
